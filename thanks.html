<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка отправлена — Easy Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FFF3E7}
*{box-sizing:border-box}
a{color:#00656E;text-decoration:none}
@keyframes drift1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.12)}100%{transform:translate(0,0) scale(1)}}
@keyframes drift2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(.9)}100%{transform:translate(0,0) scale(1)}}
@keyframes drift3{0%{transform:translate(0,0)}50%{transform:translate(40px,60px)}100%{transform:translate(0,0)}}
@keyframes seed{0%{transform:translate(0,110vh) rotate(0deg);opacity:0}8%{opacity:.75}92%{opacity:.6}100%{transform:translate(80px,-12vh) rotate(320deg);opacity:0}}
@keyframes ringpulse{0%{transform:scale(.85);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes checkPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.btn{margin-top:26px;display:inline-block;font-family:Oswald,system-ui,sans-serif;font-size:16px;font-weight:500;letter-spacing:.02em;color:#fff;background:#16BECF;border-radius:12px;padding:15px 30px;box-shadow:0 14px 30px -14px rgba(22,190,207,.9);transition:background .2s,transform .15s,box-shadow .2s}
.btn:hover{background:#00656E;transform:translateY(-1px);box-shadow:0 18px 34px -14px rgba(0,101,110,.7)}
.btn:active{transform:translateY(0);box-shadow:0 8px 18px -12px rgba(0,101,110,.8)}
.btn:focus-visible{outline:2px solid #00656E;outline-offset:3px}
</style>
</head>
<body>
<div style="position:relative;min-height:100vh;width:100%;overflow:hidden;background:#FFF3E7;font-family:Oswald,system-ui,sans-serif;color:#00656E;display:flex;align-items:center;justify-content:center;padding:56px 20px">

  <div style="position:absolute;inset:0;overflow:hidden;pointer-events:none">
    <div style="position:absolute;top:-14vh;left:-10vw;width:46vw;height:46vw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#B8E3EC,rgba(184,227,236,0));filter:blur(6px);animation:drift1 22s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:-18vh;right:-12vw;width:52vw;height:52vw;border-radius:50%;background:radial-gradient(circle at 60% 40%,#97D5C9,rgba(151,213,201,0));opacity:.85;filter:blur(8px);animation:drift2 28s ease-in-out infinite"></div>
    <div style="position:absolute;top:38%;right:14%;width:22vw;height:22vw;border-radius:50%;background:radial-gradient(circle,rgba(22,190,207,.28),rgba(22,190,207,0));filter:blur(4px);animation:drift3 19s ease-in-out infinite"></div>
    <div style="position:absolute;top:22%;left:12%;width:180px;height:180px;border-radius:50%;border:1px solid rgba(22,190,207,.35);animation:ringpulse 7s ease-out infinite"></div>
    <div style="position:absolute;bottom:18%;left:30%;width:120px;height:120px;border-radius:50%;border:1px solid rgba(0,101,110,.25);animation:ringpulse 9s ease-out infinite 2s"></div>

    <div style="position:absolute;left:8%;bottom:0;animation:seed 17s linear infinite"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="opacity:.8"><circle cx="17" cy="17" r="2" fill="#16BECF"/><g stroke="#16BECF" stroke-width="1" stroke-linecap="round"><line x1="17" y1="17" x2="30" y2="17"/><line x1="17" y1="17" x2="27" y2="26"/><line x1="17" y1="17" x2="17" y2="30"/><line x1="17" y1="17" x2="7" y2="26"/><line x1="17" y1="17" x2="4" y2="17"/><line x1="17" y1="17" x2="7" y2="8"/><line x1="17" y1="17" x2="17" y2="4"/><line x1="17" y1="17" x2="27" y2="8"/></g></svg></div>
    <div style="position:absolute;left:26%;bottom:0;animation:seed 23s linear infinite 3s"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="opacity:.55"><circle cx="17" cy="17" r="2" fill="#16BECF"/><g stroke="#16BECF" stroke-width="1" stroke-linecap="round"><line x1="17" y1="17" x2="30" y2="17"/><line x1="17" y1="17" x2="27" y2="26"/><line x1="17" y1="17" x2="17" y2="30"/><line x1="17" y1="17" x2="7" y2="26"/><line x1="17" y1="17" x2="4" y2="17"/><line x1="17" y1="17" x2="7" y2="8"/><line x1="17" y1="17" x2="17" y2="4"/><line x1="17" y1="17" x2="27" y2="8"/></g></svg></div>
    <div style="position:absolute;left:52%;bottom:0;animation:seed 20s linear infinite 8s"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="opacity:.7"><circle cx="17" cy="17" r="2" fill="#16BECF"/><g stroke="#16BECF" stroke-width="1" stroke-linecap="round"><line x1="17" y1="17" x2="30" y2="17"/><line x1="17" y1="17" x2="27" y2="26"/><line x1="17" y1="17" x2="17" y2="30"/><line x1="17" y1="17" x2="7" y2="26"/><line x1="17" y1="17" x2="4" y2="17"/><line x1="17" y1="17" x2="7" y2="8"/><line x1="17" y1="17" x2="17" y2="4"/><line x1="17" y1="17" x2="27" y2="8"/></g></svg></div>
    <div style="position:absolute;left:73%;bottom:0;animation:seed 26s linear infinite 5s"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="opacity:.45"><circle cx="17" cy="17" r="2" fill="#16BECF"/><g stroke="#16BECF" stroke-width="1" stroke-linecap="round"><line x1="17" y1="17" x2="30" y2="17"/><line x1="17" y1="17" x2="27" y2="26"/><line x1="17" y1="17" x2="17" y2="30"/><line x1="17" y1="17" x2="7" y2="26"/><line x1="17" y1="17" x2="4" y2="17"/><line x1="17" y1="17" x2="7" y2="8"/><line x1="17" y1="17" x2="17" y2="4"/><line x1="17" y1="17" x2="27" y2="8"/></g></svg></div>
    <div style="position:absolute;left:89%;bottom:0;animation:seed 21s linear infinite 12s"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="opacity:.65"><circle cx="17" cy="17" r="2" fill="#16BECF"/><g stroke="#16BECF" stroke-width="1" stroke-linecap="round"><line x1="17" y1="17" x2="30" y2="17"/><line x1="17" y1="17" x2="27" y2="26"/><line x1="17" y1="17" x2="17" y2="30"/><line x1="17" y1="17" x2="7" y2="26"/><line x1="17" y1="17" x2="4" y2="17"/><line x1="17" y1="17" x2="7" y2="8"/><line x1="17" y1="17" x2="17" y2="4"/><line x1="17" y1="17" x2="27" y2="8"/></g></svg></div>
  </div>

  <div style="position:relative;width:100%;max-width:560px;animation:riseIn .7s cubic-bezier(.2,.7,.3,1) both">

    <div style="display:flex;justify-content:center;margin-bottom:34px">
      <img src="uploads/logo.png" alt="EASY TOUR" style="width:190px;height:auto;display:block">
    </div>

    <div style="background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(151,213,201,.55);border-radius:22px;box-shadow:0 24px 60px -30px rgba(0,101,110,.45);padding:54px 34px;text-align:center">

      <div style="width:72px;height:72px;margin:0 auto 24px;border-radius:50%;background:#B8E3EC;display:flex;align-items:center;justify-content:center;animation:checkPop .55s cubic-bezier(.2,.7,.3,1) both">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#00656E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6" style="stroke-dasharray:30;stroke-dashoffset:30;animation:drawCheck .5s ease-out .35s forwards"/>
        </svg>
      </div>

      <p style="margin:0 0 12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:#16BECF">Профессия турагента</p>

      <h1 style="margin:0 0 14px;font-size:28px;line-height:1.25;font-weight:500;color:#00656E">Заявка отправлена</h1>

      <p style="margin:0;font-size:16px;line-height:1.6;font-weight:300;color:rgba(0,101,110,.82);text-wrap:pretty">Видео «Как попасть в профессию турагента в 2026» уже в пути — придёт на указанную почту и продублируем в Telegram. Если через пару минут письма нет, загляни в папку «Промоакции».</p>

      <a class="btn" href="/">Вернуться на главную</a>

    </div>

  </div>
</div>
</body>
</html>
